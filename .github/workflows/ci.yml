name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      # expo lint otherwise prompts/pings home on a cold cache.
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # backend, frontend and mobile all import @sms/shared's compiled dist/,
      # which is gitignored — without this every later step fails to resolve it.
      - name: Build shared package
        run: npm run build:shared

      # The backend suite starts its own single-node replica-set mongod via
      # mongodb-memory-server (see backend/test/mongo-global-setup.ts), which is
      # what makes Mongoose transactions work. Caching the downloaded binary
      # keeps that off the critical path on every run.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Needs no MongoDB or Redis service: mongod is in-process, and REDIS_URL
      # deliberately points at a dead port so the suite also proves a Redis
      # outage degrades the API instead of hanging it.
      - name: Test
        run: npm test

      # Run again, alone and named, so a tenant-isolation regression is
      # legible in the checks list rather than buried in a 220-line summary.
      # `npm test` above already covers these; the cost is a few seconds and
      # the benefit is that "Cross-tenant isolation" appears as its own red X
      # on the PR — which is the failure nobody should have to go looking for.
      - name: Cross-tenant isolation
        run: npm run test:cross-tenant -w backend

      # The registry is the contract: a tenant-owned model that nobody
      # registered gets none of the isolation probes, and its absence is
      # invisible in a green run. This fails the build on an unregistered
      # model rather than waiting for someone to notice.
      - name: Every tenant model is registered
        run: npm run check:registry -w backend
